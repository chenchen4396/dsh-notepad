# dsh-prompt-assistant bundle patch: inserts the prompt-assistant row into
# the profile roster. The node half (exports ".") runs in the host process
# (no-op here), and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client", served at
# /plugins/dsh-prompt-assistant/client.js) load in the web GUI and register a
# settings section.
- insert:
    - id: prompt-assistant
      name: dsh-prompt-assistant