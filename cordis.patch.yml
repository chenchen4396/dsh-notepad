# dsh-notepad bundle patch: inserts the notepad row into
# the profile roster. The node half (exports ".") runs in the host process
# (no-op here), and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client", served at
# /plugins/dsh-notepad/client.js) load in the web GUI and register a
# settings section.
- insert:
    - id: notepad
      name: dsh-notepad